<!doctype html><meta charset="utf-8"><title>Editable diagnostic</title>
<style>html,body{margin:0;width:360px;height:640px;overflow:hidden}canvas{display:block}</style>
<canvas id="stage" width="360" height="640"></canvas>
<script>
window.renderFrame=(frame,p)=>{
 const c=document.getElementById('stage'),x=c.getContext('2d');x.setTransform(1,0,0,1,0,0);x.globalAlpha=1;x.clearRect(0,0,360,640);x.fillStyle='#F7F3EA';x.fillRect(0,0,360,640);
 const ease=t=>1-Math.pow(1-Math.max(0,Math.min(1,t)),3),enter=ease(frame/18),exit=frame<78?1:(89-frame)/11;
 const wrap=(text,width,maxLines)=>{const lines=[];let line='';for(const char of text){if(x.measureText(line+char).width>width){if(!line)throw Error('Glyph exceeds layout capacity');lines.push(line);line=''}line+=char}if(line)lines.push(line);if(lines.length>maxLines)throw Error('Text exceeds layout capacity; split content explicitly');return lines};
 x.globalAlpha=Math.max(0,exit);x.fillStyle=p.accent;x.fillRect(24,112,312*enter,6);x.fillStyle='#242722';x.font='bold 23px sans-serif';wrap(p.title,312,3).forEach((line,i)=>x.fillText(line,24,160+i*30));
 const step=60;
 p.items.forEach((label,i)=>{const a=ease((frame-8-i*5)/14),y=270+i*step+(1-a)*18;x.save();x.globalAlpha=Math.max(0,exit)*a;x.fillStyle=p.accent;x.fillRect(24,y,312,52);x.fillStyle='#FFFFFF';x.font='18px sans-serif';wrap((i+1)+'. '+label,280,2).forEach((line,j)=>x.fillText(line,40,y+22+j*22));x.restore()});x.globalAlpha=1;
};
</script>
