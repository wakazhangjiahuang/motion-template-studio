name: author-contract-checks
on: [push, pull_request]
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python tests/run.py
      - run: python tests/mcp_roundtrip.py
  browser-render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt
      - run: npm install --prefix workspaces/browser playwright@1.62.1
      - run: npx --prefix workspaces/browser playwright install --with-deps chromium
      - name: Install media tools and Chinese fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk
      - run: python tests/render_smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diagnostic-browser-render
          path: workspaces/ci-render/
          retention-days: 7
